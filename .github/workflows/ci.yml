name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equity_research_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      # CPU-only torch first, same as backend/Dockerfile -- installing
      # requirements.txt directly pulls the default CUDA-bundled wheel
      # (several GB) that's never used here either.
      - run: pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest
      # Real Postgres, not SQLite -- this is what caught a genuine migration
      # ordering bug (0005 violated its own NOT NULL constraint against
      # real pre-existing data) that every SQLite-backed test missed
      # entirely, because Base.metadata.create_all() never runs the
      # migration chain at all.
      - name: alembic upgrade head against real Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/equity_research_ci
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/equity_research_ci
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
