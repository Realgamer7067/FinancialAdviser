services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: equity_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      CONFIG_DIR: /app/config
      DATA_DIR: /app/data
      KRONOS_REPO_PATH: /opt/kronos
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/equity_research
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/equity_research
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    env_file: .env
    environment:
      CONFIG_DIR: /app/config
      DATA_DIR: /app/data
      KRONOS_REPO_PATH: /opt/kronos
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/equity_research
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/equity_research
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: python -m app.worker

  frontend:
    build: ./frontend
    environment:
      # Server-side only (read by next.config.js's rewrite proxy at request
      # time) -- "backend" is the compose service hostname, reachable over
      # the compose network regardless of what URL the browser is on.
      INTERNAL_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
