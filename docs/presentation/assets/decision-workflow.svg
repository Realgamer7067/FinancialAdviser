<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Financial Advisor — fair decision comparison</title>
<desc id="desc">HOLD and each alternative share a baseline and identical external cash flows.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="65" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a" text-anchor="start">Financial Advisor — fair decision comparison</text>
<text x="65" y="129" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="start">HOLD and each alternative share a baseline and identical external cash flows.</text>
<rect x="300" y="170" width="1000" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="800.0" y="215" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">Freeze baseline</text>
<text x="800.0" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">Portfolio state, valuation, constraints and goals</text>
<rect x="300" y="335" width="1000" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="800.0" y="380" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">Apply equal contributions and withdrawals</text>
<text x="800.0" y="418" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">No advantage from receiving extra money</text>
<rect x="90" y="510" width="660" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="420.0" y="555" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">HOLD baseline</text>
<text x="420.0" y="593" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">New money remains cash</text>
<text x="420.0" y="622" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">Recompute covered portfolio metrics</text>
<rect x="850" y="510" width="660" height="140" rx="14" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="1180.0" y="555" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">Alternative proposals</text>
<text x="1180.0" y="593" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">Apply hard gates and cost availability</text>
<text x="1180.0" y="622" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">Recompute full metrics; check conservation</text>
<rect x="210" y="725" width="1180" height="110" rx="14" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="800.0" y="770" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">Compare material changes and record the reasons</text>
<text x="800.0" y="808" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">Dominates / tradeoff / no benefit / worse / needs input; owner decides</text>
<polyline points="800,280 800,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="800,445 800,475 420,475 420,510" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="800,445 800,475 1180,475 1180,510" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="420,650 420,725" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1180,650 1180,725" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="65" y="877" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Financial Advisor  |  Conceptual implementation diagram  |  Read-only owner analysis</text>
</svg>