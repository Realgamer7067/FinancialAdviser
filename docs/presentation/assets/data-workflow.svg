<text x="800.0" y="780" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">Twin + valuation + readiness → risk / plans / comparisons</text>
<text x="800.0" y="818" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">Dated source coverage, hard gates, conserved money and owner review</text>
