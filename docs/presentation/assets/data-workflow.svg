<text x="420.0" y="570" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">Complete usable import</text>
<text x="420.0" y="608" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">Latest complete batch per included account</text>
<text x="420.0" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">Bind financial facts, goals and claims</text>
<rect x="850" y="525" width="660" height="145" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1180.0" y="570" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">Partial, invalid or unavailable</text>
<text x="1180.0" y="608" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">Report errors; retain prior complete data</text>
<text x="1180.0" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">No invented zero balances or identities</text>
