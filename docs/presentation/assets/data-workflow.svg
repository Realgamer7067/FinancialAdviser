<text x="65" y="129" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="start">Complete imports feed the twin; unknown, partial and stale data remain visible.</text>
<rect x="410" y="175" width="780" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
