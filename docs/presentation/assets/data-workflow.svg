<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Financial Advisor — data to review</title>
<desc id="desc">Complete imports feed the twin; unknown, partial and stale data remain visible.</desc>
