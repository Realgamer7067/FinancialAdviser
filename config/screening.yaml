# Stock-universe reduction thresholds (Section 15). Configurable, not hardcoded.
universe: nifty50

liquidity_screen:
  min_avg_daily_volume: 100000
  min_market_cap_cr: 5000

fundamental_screen:
  max_debt_to_equity: 3.0
  min_roe: 0.0          # UNKNOWN values are excluded, not defaulted to pass
  exclude_pledged_promoter_holding_above: 0.5

technical_screen:
  max_volatility_30d: 0.6
  exclude_below_sma_200: false   # informational only, not an automatic exclusion

candidate_limits:
  after_fundamental_technical_screen: 40
  after_kronos_news: 15
  # Raised 3 -> 8 (2026-09-16): with only 3 candidates reaching the council/
  # portfolio-optimizer stage, every candidate hit the same max_single_weight
  # cap (moderate risk profile = 0.25), producing a flat equal-split
  # allocation and a "sector concentration" chart that trivially duplicated
  # the per-stock chart (3 stocks, 3 different sectors, no overlap possible).
  # 8 candidates gives the MVO solver room to actually differentiate weights
  # and gives the user real choice among diversified names, not just
  # whichever 3 happened to rank highest.
  final_council_input: 8
