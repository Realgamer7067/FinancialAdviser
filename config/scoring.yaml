# Deterministic final-score weights (Section 18). Must sum to 1.0.
# The score is computed in Python, never invented by the LLM.
weights:
  fundamental: 0.25
  kronos: 0.20
  news: 0.15
  technical: 0.15
  portfolio: 0.15
  risk: 0.10

# Recommendation label thresholds, applied to the final 0-100 score
# AFTER the risk gate has run (Section 20).
thresholds:
  strong_candidate: 80
  candidate: 65
  watchlist: 50
  # below watchlist -> NO_RECOMMENDATION

  # Minimum risk_fit_score (Section 21) required to pass the gate at all.
  # Raised in a high-volatility market regime (nifty_trend + india_vix, see
  # services/market_regime.py) so a stock has to be a noticeably better fit
  # for the user's risk profile before it's surfaced during turbulent markets.
  risk_fit_floor: 30
  high_volatility_risk_fit_floor: 45

# Confidence bands (Section 19), derived from measurable evidence-consistency factors,
# never a bare LLM-stated percentage.
confidence:
  high_min: 0.75
  medium_min: 0.5
  # below medium_min -> low confidence, forces NO_RECOMMENDATION regardless of score

# Composite stock risk-tier classification (distinct from risk_fit_score, which is
# how well a stock's volatility matches the USER's risk tolerance -- this is the
# stock's OWN objective risk level, from a fuller signal set than volatility alone).
# Each signal below is bucketed into a 0-100 "riskiness" score, then weight-averaged
# over whichever signals are actually present -- never guessed when data is missing
# (Section 8: an instrument with fewer than min_inputs signals gets risk_tier=None).
risk_tier:
  min_inputs: 2
  weights:
    volatility_30d: 0.40
    drawdown_1y: 0.25
    beta: 0.20
    debt_to_equity: 0.15

  # [upper_bound_exclusive, riskiness_points] pairs, first match wins.
  # 0.60 mirrors screening.yaml technical_screen.max_volatility_30d.
  volatility_bands: [[0.20, 20], [0.30, 40], [0.45, 65], [0.60, 85], [999, 100]]
  # evaluated against abs(drawdown_1y) -- drawdown_1y is stored as a negative fraction.
  drawdown_bands: [[0.10, 15], [0.20, 35], [0.35, 60], [0.50, 80], [999, 100]]
  beta_bands: [[0.7, 15], [1.0, 35], [1.3, 60], [1.6, 80], [999, 100]]
  # 3.0 mirrors screening.yaml fundamental_screen.max_debt_to_equity.
  debt_to_equity_bands: [[0.5, 15], [1.0, 30], [2.0, 55], [3.0, 75], [999, 95]]

  # Composite riskiness (0-100, higher = riskier) -> 4-band tier label.
  thresholds:
    safer: 30      # score < 30        -> "safer"
    moderate: 55   # 30  <= score < 55 -> "moderate"
    risky: 80      # 55  <= score < 80 -> "risky"
                    # score >= 80       -> "riskiest"
